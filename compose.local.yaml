services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY before starting the API container}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-live-preview}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-ascuita}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account.json
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
    volumes:
      - ./firebase_service_account.json:/run/secrets/firebase_service_account.json:ro
    healthcheck:
      test: ["CMD", "node", "scripts/smoke-test.mjs", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
