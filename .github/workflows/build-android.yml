name: Build Android artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build_android:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
      VITE_GEMINI_MODEL: ${{ vars.VITE_GEMINI_MODEL }}
      VITE_DEBUG_MODE: 'false'
      VERSION_NAME: ${{ vars.ANDROID_VERSION_NAME }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Configure mobile frontend environment
        shell: bash
        run: |
          cat > apps/web/.env.mobile <<EOF
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          VITE_FIREBASE_CONFIG=${VITE_FIREBASE_CONFIG}
          VITE_GEMINI_MODEL=${VITE_GEMINI_MODEL}
          VITE_DEBUG_MODE=${VITE_DEBUG_MODE}
          EOF

      - name: Configure Firebase Android
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > apps/web/android/app/google-services.json

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/web/android/app/ascuita-upload.jks
          cat > apps/web/android/keystore.properties <<EOF
          storeFile=ascuita-upload.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Sync Capacitor
        run: npm run mobile:sync

      - name: Build signed APK and AAB
        shell: bash
        run: |
          chmod +x apps/web/android/gradlew
          cd apps/web/android
          ./gradlew assembleRelease bundleRelease \
            -PVERSION_CODE="${GITHUB_RUN_NUMBER}" \
            -PVERSION_NAME="${VERSION_NAME:-1.0.0}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ascuita-android-${{ github.run_number }}
          path: |
            apps/web/android/app/build/outputs/apk/release/*.apk
            apps/web/android/app/build/outputs/bundle/release/*.aab
