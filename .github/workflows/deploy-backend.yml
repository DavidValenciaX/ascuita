name: Deploy backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'Dockerfile.api'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  CLOUD_RUN_GEMINI_SECRET: ${{ vars.CLOUD_RUN_GEMINI_SECRET }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
  CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
  REDIS_URL: ${{ vars.REDIS_URL }}
  CLOUD_RUN_VPC_NETWORK: ${{ vars.CLOUD_RUN_VPC_NETWORK }}
  CLOUD_RUN_VPC_SUBNET: ${{ vars.CLOUD_RUN_VPC_SUBNET }}
  CLOUD_RUN_CPU: "1"
  CLOUD_RUN_MEMORY: 1Gi
  CLOUD_RUN_CONCURRENCY: "80"
  CLOUD_RUN_MIN_INSTANCES: "0"
  CLOUD_RUN_MAX_INSTANCES: "3"
  CLOUD_RUN_TIMEOUT_SECONDS: "3600"

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:api

      - name: Build
        run: npm run build:api

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        env:
          IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          docker build -f Dockerfile.api -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Write Cloud Run environment file
        shell: bash
        run: |
          cat > backend-cloudrun.env.yaml <<EOF
          FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
          GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-live-preview}"
          CORS_ORIGIN: "${CORS_ORIGIN}"
          REDIS_URL: "${REDIS_URL}"
          REDIS_CLEANUP_TOKEN: "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EOF

          if [ -z "${REDIS_URL}" ]; then
            echo "REDIS_URL must be configured as a GitHub Actions variable before deploying Cloud Run."
            exit 1
          fi

          if [ -z "${CLOUD_RUN_VPC_NETWORK}" ] || [ -z "${CLOUD_RUN_VPC_SUBNET}" ]; then
            echo "CLOUD_RUN_VPC_NETWORK and CLOUD_RUN_VPC_SUBNET must be configured as GitHub Actions variables before deploying Cloud Run."
            exit 1
          fi

      - name: Deploy to Cloud Run
        shell: bash
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_URI}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}" \
            --network "${CLOUD_RUN_VPC_NETWORK}" \
            --subnet "${CLOUD_RUN_VPC_SUBNET}" \
            --vpc-egress private-ranges-only \
            --port 8080 \
            --cpu "${CLOUD_RUN_CPU}" \
            --cpu-boost \
            --memory "${CLOUD_RUN_MEMORY}" \
            --concurrency "${CLOUD_RUN_CONCURRENCY}" \
            --min-instances "${CLOUD_RUN_MIN_INSTANCES}" \
            --max-instances "${CLOUD_RUN_MAX_INSTANCES}" \
            --timeout "${CLOUD_RUN_TIMEOUT_SECONDS}" \
            --env-vars-file backend-cloudrun.env.yaml \
            --set-secrets "GEMINI_API_KEY=${CLOUD_RUN_GEMINI_SECRET}:latest"

      - name: Smoke test deployed API
        shell: bash
        run: |
          SERVICE_URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')
          node apps/api/scripts/smoke-test.mjs "${SERVICE_URL}"

      - name: Show deployed service URL
        shell: bash
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)'
